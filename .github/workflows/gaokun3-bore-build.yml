name: gaokun3-bore candidate build
on:
  push:
    branches:
      - 'port/7.2.15-bore-source-first'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev clang llvm lld device-tree-compiler

      - name: Configure and report resolved options
        shell: bash
        run: |
          set -euo pipefail
          make O=build ARCH=arm64 LLVM=1 gaokun3_defconfig
          echo '### Resolved kernel options'
          for option in SCHED_BORE KVM KPROBES FTRACE KPROBE_EVENTS TRACING TRACEFS_FS QCOM_FASTRPC VIDEO_OV13B10 LEDS_QCOM_FLASH; do
            value="$(grep -E "^(CONFIG_${option}=|# CONFIG_${option} is not set)" build/.config || true)"
            printf '%-22s %s\n' "$option" "${value:-<unset>}"
          done
          grep -E '^(CONFIG_(SCHED_BORE|KVM|KPROBES|FTRACE|KPROBE_EVENTS|TRACING|TRACEFS_FS|QCOM_FASTRPC|VIDEO_OV13B10|LEDS_QCOM_FLASH)=|# CONFIG_(SCHED_BORE|KVM|KPROBES|FTRACE|KPROBE_EVENTS|TRACING|TRACEFS_FS|QCOM_FASTRPC|VIDEO_OV13B10|LEDS_QCOM_FLASH) is not set)' build/.config || true

      - name: Compile ARM64 Image, DTBs and modules
        shell: bash
        run: |
          set -euo pipefail
          make O=build ARCH=arm64 LLVM=1 -j4 Image dtbs modules 2>&1 | tee arm64-build.log

      - name: Upload config and build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaokun3-bore-source-first-diagnostic
          path: |
            build/.config
            arm64-build.log
            build/arch/arm64/boot/Image
            build/arch/arm64/boot/dts/qcom/sc8280xp-huawei-gaokun3.dtb
            build/Module.symvers
          if-no-files-found: ignore
